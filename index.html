<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 QR 코드 생성기</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- qr-code-styling Library for high-customization QR generation -->
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
        .color-picker-wrapper input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
        }
        .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        .color-picker-wrapper input[type="color"]::-webkit-color-swatch {
            border: 2px solid #e5e7eb;
            border-radius: 50%;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md">
                    <i data-lucide="qr-code" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900 leading-none">QR Master</h1>
                    <p class="text-xs text-slate-500 mt-0.5">빠르고 자유로운 QR코드 생성기</p>
                </div>
            </div>
            <div class="flex items-center space-x-2 text-sm text-slate-500">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5"></span> 실시간 생성 중
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 lg:p-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- Left Controls Column -->
            <div class="lg:col-span-7 space-y-6">
                
                <!-- URL / Content Input Card -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80">
                    <label for="qr-text" class="block text-sm font-semibold text-slate-700 mb-2 flex items-center justify-between">
                        <span><i data-lucide="link" class="w-4 h-4 inline mr-1.5 text-indigo-500"></i>웹사이트 주소 (URL) 또는 텍스트</span>
                        <span id="char-count" class="text-xs text-slate-400 font-normal">0자</span>
                    </label>
                    <div class="relative">
                        <textarea id="qr-text" rows="3" 
                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-slate-800 placeholder-slate-400 resize-none"
                            placeholder="https://example.com 또는 연결할 주소를 입력하세요..."></textarea>
                        <button id="btn-clear" class="absolute right-3 top-3 text-slate-400 hover:text-slate-600 hidden">
                            <i data-lucide="x-circle" class="w-5 h-5"></i>
                        </button>
                    </div>
                    
                    <!-- Quick Presets -->
                    <div class="mt-3 flex flex-wrap gap-2 items-center text-xs text-slate-500">
                        <span class="font-medium">빠른 예시:</span>
                        <button class="preset-btn px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 transition" data-url="https://www.google.com">Google</button>
                        <button class="preset-btn px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 transition" data-url="https://www.naver.com">Naver</button>
                        <button class="preset-btn px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 transition" data-url="https://www.youtube.com">YouTube</button>
                        <button class="preset-btn px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 transition" data-url="https://www.instagram.com">Instagram</button>
                    </div>
                </div>

                <!-- Customization Options -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80 space-y-6">
                    <h2 class="text-base font-bold text-slate-800 border-b border-slate-100 pb-3 flex items-center">
                        <i data-lucide="palette" class="w-5 h-5 mr-2 text-indigo-500"></i> 커스텀 디자인 설정
                    </h2>

                    <!-- Accordion or Section 1: Colors -->
                    <div class="space-y-4">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">색상 설정</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <!-- Main Color -->
                            <div class="flex items-center justify-between p-3 rounded-xl border border-slate-100 bg-slate-50/50">
                                <div>
                                    <p class="text-sm font-medium text-slate-700">도트 (QR 색상)</p>
                                    <p class="text-xs text-slate-400">코드 본체 색상</p>
                                </div>
                                <div class="color-picker-wrapper flex items-center space-x-2">
                                    <input type="color" id="dots-color" value="#1e293b">
                                </div>
                            </div>

                            <!-- Background Color -->
                            <div class="flex items-center justify-between p-3 rounded-xl border border-slate-100 bg-slate-50/50">
                                <div>
                                    <p class="text-sm font-medium text-slate-700">배경 색상</p>
                                    <p class="text-xs text-slate-400">QR코드 뒷배경</p>
                                </div>
                                <div class="color-picker-wrapper flex items-center space-x-2">
                                    <input type="color" id="bg-color" value="#ffffff">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Section 2: Shapes & Style -->
                    <div class="space-y-4 pt-2">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">모양 및 스타일</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <!-- Dots Pattern -->
                            <div>
                                <label for="dots-style" class="block text-xs font-medium text-slate-600 mb-1">도트 패턴</label>
                                <select id="dots-style" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm bg-white focus:ring-2 focus:ring-indigo-500">
                                    <option value="square">기본 (Square)</option>
                                    <option value="dots">점형 (Dots)</option>
                                    <option value="rounded" selected>부드럽게 (Rounded)</option>
                                    <option value="extra-rounded">둥글게 (Extra Rounded)</option>
                                    <option value="classy">클래시 (Classy)</option>
                                </select>
                            </div>

                            <!-- Corner Square Style -->
                            <div>
                                <label for="corners-style" class="block text-xs font-medium text-slate-600 mb-1">모서리 테두리</label>
                                <select id="corners-style" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm bg-white focus:ring-2 focus:ring-indigo-500">
                                    <option value="square">직각 (Square)</option>
                                    <option value="dot">원형 (Dot)</option>
                                    <option value="extra-rounded" selected>둥근 모서리 (Extra Rounded)</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Section 3: Logo Upload -->
                    <div class="space-y-4 pt-2">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">중앙 로고 추가</h3>
                        <div class="flex items-center space-x-4">
                            <label class="flex-1 flex items-center justify-center px-4 py-3 border-2 border-dashed border-slate-200 rounded-xl cursor-pointer hover:border-indigo-400 hover:bg-indigo-50/30 transition text-sm text-slate-600">
                                <i data-lucide="image" class="w-4 h-4 mr-2 text-indigo-500"></i>
                                <span id="logo-file-name">로고 이미지 업로드 (PNG/JPG)</span>
                                <input type="file" id="logo-input" accept="image/*" class="hidden">
                            </label>
                            <button id="btn-remove-logo" class="p-3 border border-slate-200 rounded-xl text-slate-400 hover:text-rose-500 hover:border-rose-200 hidden transition" title="로고 제거">
                                <i data-lucide="trash-2" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Quick Preset Themes -->
                    <div class="space-y-2 pt-2">
                        <label class="block text-xs font-medium text-slate-600">추천 디자인 테마</label>
                        <div class="flex flex-wrap gap-2">
                            <button class="theme-preset px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-medium hover:bg-slate-50 flex items-center space-x-1.5" data-dots="#1e293b" data-bg="#ffffff" data-style="rounded">
                                <span class="w-3 h-3 rounded-full bg-slate-800 inline-block"></span>
                                <span>모던 블랙</span>
                            </button>
                            <button class="theme-preset px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-medium hover:bg-slate-50 flex items-center space-x-1.5" data-dots="#4f46e5" data-bg="#ffffff" data-style="extra-rounded">
                                <span class="w-3 h-3 rounded-full bg-indigo-600 inline-block"></span>
                                <span>인디고 블루</span>
                            </button>
                            <button class="theme-preset px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-medium hover:bg-slate-50 flex items-center space-x-1.5" data-dots="#059669" data-bg="#ffffff" data-style="dots">
                                <span class="w-3 h-3 rounded-full bg-emerald-600 inline-block"></span>
                                <span>에메랄드 포인트</span>
                            </button>
                            <button class="theme-preset px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-medium hover:bg-slate-50 flex items-center space-x-1.5" data-dots="#e11d48" data-bg="#fff1f2" data-style="rounded">
                                <span class="w-3 h-3 rounded-full bg-rose-600 inline-block"></span>
                                <span>파스텔 로즈</span>
                            </button>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Right Preview Column -->
            <div class="lg:col-span-5 sticky top-24">
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80 text-center flex flex-col items-center">
                    
                    <div class="w-full flex items-center justify-between mb-4">
                        <span class="text-sm font-bold text-slate-700 flex items-center">
                            <i data-lucide="eye" class="w-4 h-4 mr-1.5 text-indigo-500"></i> 실시간 미리보기
                        </span>
                        <span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full font-mono">300x300 px</span>
                    </div>

                    <!-- QR Code Canvas Container -->
                    <div id="qr-wrapper" class="relative p-6 bg-slate-50 rounded-2xl border border-slate-100 flex items-center justify-center min-h-[300px] w-full transition-all">
                        <div id="qr-code" class="flex justify-center items-center"></div>
                        
                        <!-- Empty Overlay when no input -->
                        <div id="empty-state" class="hidden absolute inset-0 bg-slate-50/90 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center p-6 text-slate-400">
                            <i data-lucide="qr-code" class="w-12 h-12 stroke-1 mb-2"></i>
                            <p class="text-sm font-medium">주소를 입력하면 QR코드가 생깁니다.</p>
                        </div>
                    </div>

                    <!-- Download Options -->
                    <div class="w-full mt-6 space-y-3">
                        <div class="grid grid-cols-2 gap-3">
                            <button id="btn-download-png" class="flex items-center justify-center px-4 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-medium text-sm transition shadow-md shadow-indigo-100 active:scale-[0.98]">
                                <i data-lucide="download" class="w-4 h-4 mr-2"></i> PNG 저장
                            </button>
                            <button id="btn-download-svg" class="flex items-center justify-center px-4 py-3 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-medium text-sm transition shadow-md shadow-slate-100 active:scale-[0.98]">
                                <i data-lucide="file-code" class="w-4 h-4 mr-2"></i> SVG 저장
                            </button>
                        </div>

                        <button id="btn-copy-link" class="w-full flex items-center justify-center px-4 py-2.5 border border-slate-200 text-slate-600 hover:bg-slate-50 rounded-xl text-sm font-medium transition">
                            <i data-lucide="copy" class="w-4 h-4 mr-2"></i> 입력한 주소 복사하기
                        </button>
                    </div>

                    <!-- Toast Notification -->
                    <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center space-x-2 text-sm opacity-0 pointer-events-none transition-all transform translate-y-2 z-50">
                        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
                        <span id="toast-message">클립보드에 복사되었습니다!</span>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-auto py-6 border-t border-slate-200 text-center text-xs text-slate-400">
        <p>© 2026 QR Master. 안전하고 빠른 클라이언트 사이드 QR 코드 생성기.</p>
    </footer>

    <!-- Application Script -->
    <script>
        // Default Configuration
        const DEFAULT_URL = 'https://www.google.com';
        let logoDataUrl = null;

        // Initialize QR Code Instance
        const qrCode = new QRCodeStyling({
            width: 260,
            height: 260,
            type: "svg",
            data: DEFAULT_URL,
            image: "",
            dotsOptions: {
                color: "#1e293b",
                type: "rounded"
            },
            backgroundOptions: {
                color: "#ffffff",
            },
            cornersSquareOptions: {
                color: "#1e293b",
                type: "extra-rounded"
            },
            imageOptions: {
                crossOrigin: "anonymous",
                margin: 6,
                imageSize: 0.25
            }
        });

        // DOM Elements
        const qrText = document.getElementById('qr-text');
        const dotsColorInput = document.getElementById('dots-color');
        const bgColorInput = document.getElementById('bg-color');
        const dotsStyleInput = document.getElementById('dots-style');
        const cornersStyleInput = document.getElementById('corners-style');
        const logoInput = document.getElementById('logo-input');
        const logoFileName = document.getElementById('logo-file-name');
        const btnRemoveLogo = document.getElementById('btn-remove-logo');
        const btnClear = document.getElementById('btn-clear');
        const charCount = document.getElementById('char-count');
        const emptyState = document.getElementById('empty-state');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');

        // Initial setup
        window.addEventListener('load', () => {
            qrText.value = DEFAULT_URL;
            updateCharCount();
            qrCode.append(document.getElementById("qr-code"));
            lucide.createIcons();
        });

        // Update QR Code
        function updateQRCode() {
            const textValue = qrText.value.trim();

            if (!textValue) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }

            qrCode.update({
                data: textValue || " ",
                dotsOptions: {
                    color: dotsColorInput.value,
                    type: dotsStyleInput.value
                },
                backgroundOptions: {
                    color: bgColorInput.value,
                },
                cornersSquareOptions: {
                    color: dotsColorInput.value,
                    type: cornersStyleInput.value
                },
                image: logoDataUrl || ""
            });
        }

        // Event Listeners for Live Updates
        qrText.addEventListener('input', () => {
            updateCharCount();
            updateQRCode();
            btnClear.classList.toggle('hidden', qrText.value.length === 0);
        });

        dotsColorInput.addEventListener('input', updateQRCode);
        bgColorInput.addEventListener('input', updateQRCode);
        dotsStyleInput.addEventListener('change', updateQRCode);
        cornersStyleInput.addEventListener('change', updateQRCode);

        // Clear text button
        btnClear.addEventListener('click', () => {
            qrText.value = '';
            updateCharCount();
            updateQRCode();
            btnClear.classList.add('hidden');
            qrText.focus();
        });

        // Preset URLs
        document.querySelectorAll('.preset-btn').forEach(button => {
            button.addEventListener('click', () => {
                qrText.value = button.dataset.url;
                updateCharCount();
                updateQRCode();
                btnClear.classList.remove('hidden');
            });
        });

        // Preset Themes
        document.querySelectorAll('.theme-preset').forEach(button => {
            button.addEventListener('click', () => {
                dotsColorInput.value = button.dataset.dots;
                bgColorInput.value = button.dataset.bg;
                dotsStyleInput.value = button.dataset.style;
                updateQRCode();
            });
        });

        // Logo Upload Handling
        logoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                if (file.size > 2 * 1024 * 1024) {
                    showToast('이미지 크기는 2MB 이하만 지원됩니다.');
                    return;
                }

                const reader = new FileReader();
                reader.onload = (event) => {
                    logoDataUrl = event.target.result;
                    logoFileName.textContent = file.name;
                    btnRemoveLogo.classList.remove('hidden');
                    updateQRCode();
                };
                reader.readAsDataURL(file);
            }
        });

        // Remove Logo
        btnRemoveLogo.addEventListener('click', () => {
            logoDataUrl = null;
            logoInput.value = '';
            logoFileName.textContent = '로고 이미지 업로드 (PNG/JPG)';
            btnRemoveLogo.classList.add('hidden');
            updateQRCode();
        });

        // Download PNG
        document.getElementById('btn-download-png').addEventListener('click', () => {
            if (!qrText.value.trim()) {
                showToast('주소를 먼저 입력해 주세요.');
                return;
            }
            qrCode.download({ name: "qrcode", extension: "png" });
            showToast('PNG 이미지 다운로드가 시작되었습니다!');
        });

        // Download SVG
        document.getElementById('btn-download-svg').addEventListener('click', () => {
            if (!qrText.value.trim()) {
                showToast('주소를 먼저 입력해 주세요.');
                return;
            }
            qrCode.download({ name: "qrcode", extension: "svg" });
            showToast('SVG 벡터 파일 다운로드가 시작되었습니다!');
        });

        // Copy Input URL
        document.getElementById('btn-copy-link').addEventListener('click', () => {
            if (!qrText.value.trim()) return;
            
            // Fallback for iframe environment clipboard issue
            const tempInput = document.createElement('textarea');
            tempInput.value = qrText.value.trim();
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            showToast('입력한 주소가 클립보드에 복사되었습니다!');
        });

        // Helper: Update Char Count
        function updateCharCount() {
            charCount.textContent = `${qrText.value.length}자`;
        }

        // Helper: Toast Notification
        function showToast(msg) {
            toastMessage.textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 2500);
        }
    </script>
</body>
</html>
